# Archivo de configuración para Google App Engine
# Uso: gcloud app deploy

runtime: python311

# Configuración de instancias
instance_class: F1  # F1 (capa gratuita), F2, F4, etc.

# Escalado automático
automatic_scaling:
  min_instances: 0
  max_instances: 2
  target_cpu_utilization: 0.65

# Variables de entorno
env_variables:
  PYTHON_ENV: "production"
  # DATABASE_URL: "tu-url-de-base-de-datos"

# Entrypoint
entrypoint: gunicorn -b :$PORT app:app
